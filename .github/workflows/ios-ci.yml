name: iOS CI

# Pushes validate the iPhone, widget and Watch targets. Manual runs additionally build and upload an iPhone + widget keyed SideStore IPA.
on:
  push:
    branches: [meteoblue-widget]
  pull_request:
    branches: [meteoblue-widget]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27_beta_3.app ]; then
            sudo xcode-select -s /Applications/Xcode_27_beta_3.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Swift package tests
        run: |
          set -euo pipefail
          swift test

      - name: Live meteoblue integration test
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${METEOBLUE_API_KEY:-}" ]; then
            echo "METEOBLUE_API_KEY is unavailable in this workflow context; live test skipped."
            exit 0
          fi
          RUN_METEOBLUE_LIVE_TEST=1 swift test --filter MeteoblueLiveIntegrationTests

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d MeteoblueWeather.xcodeproj

      - name: Build app and embedded iPhone widget
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/meteoblue-app-widget-xcodebuild.log"
          set +e
          xcodebuild \
            -project MeteoblueWeather.xcodeproj \
            -scheme MeteoblueWeather \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Exact xcodebuild error lines"
            errors="$(grep -n -E 'fatal error:|error:' "$LOG" || true)"
            if [ -n "$errors" ]; then
              printf '%s\n' "$errors"
              while IFS= read -r line; do
                echo "::error::$line"
              done <<< "$errors"
            else
              errors="xcodebuild failed with status $status but no literal compiler error line was found."
              echo "::error::$errors"
            fi
            {
              echo "### Exact xcodebuild error lines"
              echo '```text'
              printf '%s\n' "$errors"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload app/widget xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteoblue-app-widget-xcodebuild-${{ github.run_id }}
          path: ${{ runner.temp }}/meteoblue-app-widget-xcodebuild.log
          if-no-files-found: warn
          retention-days: 1

      - name: Build iPhone widget extension explicitly
        run: |
          set -euo pipefail
          xcodebuild \
            -project MeteoblueWeather.xcodeproj \
            -target MeteoblueWidgetExtension \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build Apple Watch app and rectangular complication
        run: |
          set -euo pipefail
          xcodebuild \
            -project MeteoblueWeather.xcodeproj \
            -scheme MeteoblueWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify no local secret file is tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Config/Secrets.xcconfig >/dev/null 2>&1; then
            echo "Config/Secrets.xcconfig must never be committed."
            exit 1
          fi

      - name: Generate SideStore embedded credential
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/meteoblue-widget'
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${METEOBLUE_API_KEY:-}" ]; then
            echo "::error::METEOBLUE_API_KEY is required to package the SideStore IPA."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import secrets

          key = os.environ["METEOBLUE_API_KEY"].encode("utf-8")
          mask = secrets.token_bytes(len(key))
          encoded = bytes(a ^ b for a, b in zip(key, mask))

          def swift_array(data: bytes) -> str:
              return ", ".join(str(value) for value in data)

          source = f'''import Foundation

          // Generated inside GitHub Actions. The repository version contains empty arrays.
          enum EmbeddedMeteoblueSecret {{
              private static let encoded: [UInt8] = [{swift_array(encoded)}]
              private static let mask: [UInt8] = [{swift_array(mask)}]

              static var apiKey: String? {{
                  guard !encoded.isEmpty, encoded.count == mask.count else {{ return nil }}
                  let bytes = zip(encoded, mask).map {{ pair in pair.0 ^ pair.1 }}
                  return String(bytes: bytes, encoding: .utf8)
              }}
          }}
          '''
          pathlib.Path("AppleSupport/EmbeddedMeteoblueSecret.swift").write_text(source, encoding="utf-8")
          PY
          echo "Generated the runner-only credential source without printing the key."

      - name: Build unsigned SideStore IPA
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/meteoblue-widget'
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/meteoblue-sidestore-build.log"
          exec > >(tee "$LOG") 2>&1
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "::error::SideStore build/package failed with status $status"; fi' EXIT

          DERIVED="$RUNNER_TEMP/MeteoblueSideStoreDerivedData"
          echo "Building unsigned Release app for SideStore..."
          xcodebuild \
            -project MeteoblueWeather.xcodeproj \
            -scheme MeteoblueWeather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

          APP="$DERIVED/Build/Products/Release-iphoneos/MeteoblueWeather.app"
          IPHONE_WIDGET="$APP/PlugIns/MeteoblueWidgetExtension.appex"
          WATCH_APP="$APP/PlugIns/MeteoblueWatch.app"

          echo "Validating generated app bundle before SideStore compatibility transform..."
          if [ ! -d "$APP" ]; then
            echo "::error::Expected SideStore app bundle was not produced."
            exit 1
          fi
          if [ ! -d "$IPHONE_WIDGET" ]; then
            echo "::error::Embedded iPhone widget extension is missing from the SideStore app bundle."
            exit 1
          fi
          if [ ! -d "$WATCH_APP" ]; then
            echo "::error::Expected Watch app was not produced by the Release build."
            exit 1
          fi

          # Physical-device validation showed that SideStore crashes while importing the four-bundle
          # IPA containing the nested Watch app + Watch widget. The same app + iPhone widget package
          # imports successfully. Keep Watch targets compiled/tested, but exclude them from SideStore.
          echo "Removing nested Watch bundles from the SideStore transport IPA..."
          rm -rf "$WATCH_APP"
          if [ -e "$WATCH_APP" ]; then
            echo "::error::Watch app still exists after SideStore compatibility transform."
            exit 1
          fi

          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "::error::Unsigned SideStore app unexpectedly contains embedded.mobileprovision."
            exit 1
          fi

          python3 - "$APP" <<'PY'
          import pathlib
          import plistlib
          import sys

          app = pathlib.Path(sys.argv[1])
          host_plist = app / "Info.plist"
          widget_plist = app / "PlugIns/MeteoblueWidgetExtension.appex/Info.plist"

          with host_plist.open("rb") as handle:
              host_info = plistlib.load(handle)
          with widget_plist.open("rb") as handle:
              widget_info = plistlib.load(handle)

          expected_ids = [
              (host_info, host_plist, "com.arthurtrovato.MeteoblueWidget"),
              (widget_info, widget_plist, "com.arthurtrovato.MeteoblueWidget.Widget"),
          ]
          for info, path, expected_id in expected_ids:
              actual_id = info.get("CFBundleIdentifier")
              if actual_id != expected_id:
                  raise SystemExit(f"Unexpected bundle id for {path.name}: {actual_id!r} != {expected_id!r}")

          for key in ("CFBundleShortVersionString", "CFBundleVersion"):
              host_value = host_info.get(key)
              widget_value = widget_info.get(key)
              if not host_value or host_value != widget_value:
                  raise SystemExit(
                      f"Host/widget {key} mismatch: host={host_value!r}, widget={widget_value!r}"
                  )

          assets = app / "Assets.car"
          if not assets.is_file() or assets.stat().st_size == 0:
              raise SystemExit("Compiled Assets.car is missing or empty; app icon/assets were not packaged.")

          icons = host_info.get("CFBundleIcons") or {}
          primary_icon = icons.get("CFBundlePrimaryIcon") if isinstance(icons, dict) else None
          if not isinstance(primary_icon, dict):
              raise SystemExit("CFBundleIcons.CFBundlePrimaryIcon is missing from the packaged app.")
          icon_files = primary_icon.get("CFBundleIconFiles") or []
          icon_name = primary_icon.get("CFBundleIconName")
          if not icon_files and not icon_name:
              raise SystemExit("Packaged app has no declared primary app icon.")

          nested_bundles = list(app.rglob("*.app")) + list(app.rglob("*.appex"))
          relative = sorted(str(path.relative_to(app)) for path in nested_bundles)
          expected = ["PlugIns/MeteoblueWidgetExtension.appex"]
          if relative != expected:
              raise SystemExit(f"Unexpected nested bundles in SideStore IPA: {relative!r}")

          print(
              "Validated SideStore bundle metadata: "
              f"version {host_info['CFBundleShortVersionString']} ({host_info['CFBundleVersion']}), "
              f"primary icon {icon_name or icon_files[0]!r}, app + one iPhone widget."
          )
          PY

          echo "Checking that the Meteoblue key is not present as plaintext..."
          python3 - "$APP" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          key = os.environ["METEOBLUE_API_KEY"].encode("utf-8")
          for path in root.rglob("*"):
              if path.is_file():
                  try:
                      data = path.read_bytes()
                  except OSError:
                      continue
                  if key and key in data:
                      raise SystemExit(f"Plaintext credential found in packaged file: {path.name}")
          PY

          echo "Packaging SideStore-compatible iPhone + widget Payload into IPA..."
          PACKAGE="$RUNNER_TEMP/MeteoblueSideStorePackage"
          mkdir -p "$PACKAGE/Payload"
          cp -R "$APP" "$PACKAGE/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$PACKAGE/Payload" \
            "$GITHUB_WORKSPACE/MeteoblueWeather-SideStore.ipa"
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/MeteoblueWeather-SideStore.ipa" >/dev/null
          echo "Unsigned SideStore IPA packaged for re-signing."

      - name: Upload SideStore build log
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/meteoblue-widget'
        uses: actions/upload-artifact@v4
        with:
          name: meteoblue-sidestore-build-${{ github.run_id }}
          path: ${{ runner.temp }}/meteoblue-sidestore-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload SideStore IPA
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/meteoblue-widget'
        uses: actions/upload-artifact@v4
        with:
          name: MeteoblueWeather-SideStore
          path: MeteoblueWeather-SideStore.ipa
          if-no-files-found: error
          retention-days: 1
