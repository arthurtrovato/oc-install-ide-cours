name: Watch CI

on:
  push:
    branches: [meteoblue-widget]
  pull_request:
    branches: [meteoblue-widget]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-watch:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27_beta_3.app ]; then
            sudo xcode-select -s /Applications/Xcode_27_beta_3.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build independent Watch app for physical watchOS device
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/MeteoblueWatchDeviceDerivedData"
          xcodebuild \
            -project MeteoblueWeather.xcodeproj \
            -scheme MeteoblueWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          WATCH_APP="$DERIVED/Build/Products/Debug-watchos/MeteoblueWatch.app"
          python3 Scripts/validate_watch_bundle.py "$WATCH_APP"

          test -x "$WATCH_APP/MeteoblueWatch"
          test -x "$WATCH_APP/PlugIns/MeteoblueWatchWidgetExtension.appex/MeteoblueWatchWidgetExtension"
          file "$WATCH_APP/MeteoblueWatch"
          file "$WATCH_APP/PlugIns/MeteoblueWatchWidgetExtension.appex/MeteoblueWatchWidgetExtension"

      - name: Build independent Watch app for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project MeteoblueWeather.xcodeproj \
            -scheme MeteoblueWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
