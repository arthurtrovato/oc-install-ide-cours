name: MeteoblueWeather
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  MeteoblueCore:
    path: .
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 6
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  MeteoblueWeather:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppleSupport
    dependencies:
      - package: MeteoblueCore
        product: MeteoblueCore
      - target: MeteoblueWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurtrovato.MeteoblueWidget
        PRODUCT_NAME: MeteoblueWeather
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  MeteoblueWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: AppleSupport
    dependencies:
      - package: MeteoblueCore
        product: MeteoblueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurtrovato.MeteoblueWidget.Widget
        PRODUCT_NAME: MeteoblueWidgetExtension
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MeteoblueWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: AppleSupport
    dependencies:
      - package: MeteoblueCore
        product: MeteoblueCore
      - target: MeteoblueWatchWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurtrovato.MeteoblueWidget.watchkitapp
        PRODUCT_NAME: MeteoblueWatch
        INFOPLIST_FILE: WatchApp/Info.plist
        TARGETED_DEVICE_FAMILY: 4
        GENERATE_INFOPLIST_FILE: NO
  MeteoblueWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidget
      - path: AppleSupport
    dependencies:
      - package: MeteoblueCore
        product: MeteoblueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurtrovato.MeteoblueWidget.watchkitapp.Widget
        PRODUCT_NAME: MeteoblueWatchWidgetExtension
        INFOPLIST_FILE: WatchWidget/Info.plist
        TARGETED_DEVICE_FAMILY: 4
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  MeteoblueWeather:
    build:
      targets:
        MeteoblueWeather: all
        MeteoblueWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
  MeteoblueWatch:
    build:
      targets:
        MeteoblueWatch: all
        MeteoblueWatchWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
