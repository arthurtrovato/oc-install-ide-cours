name: MeteoblueWeather
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MeteoblueCore:
    path: .
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  MeteoblueWeather:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppleSupport
    info:
      path: App/Info.plist
    dependencies:
      - package: MeteoblueCore
        product: MeteoblueCore
      - target: MeteoblueWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurtrovato.MeteoblueWidget
        PRODUCT_NAME: MeteoblueWeather
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  MeteoblueWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: AppleSupport
    info:
      path: Widget/Info.plist
    dependencies:
      - package: MeteoblueCore
        product: MeteoblueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurtrovato.MeteoblueWidget.Widget
        PRODUCT_NAME: MeteoblueWidgetExtension
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  MeteoblueWeather:
    build:
      targets:
        MeteoblueWeather: all
        MeteoblueWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
